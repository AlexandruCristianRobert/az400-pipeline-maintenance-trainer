<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline Maintenance Practice Lab</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --text:#1d2330; --muted:#5d6678; --line:#e1e5ec;
  --accent:#0f6cbd; --accent-soft:#e6f0fa; --ok:#127a3c; --ok-soft:#e5f5eb; --bad:#b42318; --bad-soft:#fdecea;
  --warn:#a35200; --warn-soft:#fdf1e3;
  --code-bg:#0f1720; --code-text:#d6dde8;
  --k:#7cc4ff; --s:#f2b880; --c:#7d8a9c; --d:#d7a6ff; --n:#9fe3a8; --t:#6fd6c9;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1116; --panel:#161b22; --text:#e3e8ef; --muted:#9aa4b2; --line:#2a313c;
    --accent:#4ea1f3; --accent-soft:#16283c; --ok:#4cc27a; --ok-soft:#13281c; --bad:#ff7b72; --bad-soft:#2d1615;
    --warn:#f0b450; --warn-soft:#2b2112;
    --code-bg:#0a0d12;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1116; --panel:#161b22; --text:#e3e8ef; --muted:#9aa4b2; --line:#2a313c;
  --accent:#4ea1f3; --accent-soft:#16283c; --ok:#4cc27a; --ok-soft:#13281c; --bad:#ff7b72; --bad-soft:#2d1615;
  --warn:#f0b450; --warn-soft:#2b2112;
  --code-bg:#0a0d12;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
code,pre,textarea{font-family:"Cascadia Code",Consolas,"SF Mono",Menlo,monospace}
.app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
aside h1{font-size:18px;margin:0 8px 4px}
aside .sub{color:var(--muted);font-size:13px;margin:0 8px 14px}
.progress{height:6px;background:var(--line);border-radius:4px;margin:0 8px 6px;overflow:hidden}
.progress>div{height:100%;background:var(--ok);width:0;transition:width .3s}
.ptext{font-size:12px;color:var(--muted);margin:0 8px 14px}
nav button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;color:var(--text);
  padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px}
nav button:hover{background:var(--accent-soft)}
nav button.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav .num{flex:0 0 24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--muted)}
nav button.done .num{background:var(--ok);border-color:var(--ok);color:#fff}
nav .cnt{margin-left:auto;font-size:11px;color:var(--muted);font-weight:400}
nav .group{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 10px 4px}
.sidefoot{margin:18px 8px 0;display:grid;gap:10px;justify-items:start}
.sidefoot a{font-size:13px;color:var(--accent)}
.theme{font-size:13px;background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 10px;cursor:pointer}
main{padding:32px 40px 80px;max-width:980px;width:100%}
.tag{display:inline-block;font-size:12px;color:var(--accent);background:var(--accent-soft);padding:2px 10px;border-radius:20px;margin-bottom:8px}
h2{font-size:28px;margin:0 0 8px}
h3{font-size:19px;margin:28px 0 8px}
p{margin:8px 0}
.lead{color:var(--muted);font-size:17px}
:not(pre)>code{background:var(--accent-soft);padding:1px 6px;border-radius:5px;font-size:.9em;overflow-wrap:anywhere}
.codewrap{position:relative;margin:12px 0}
pre{background:var(--code-bg);color:var(--code-text);padding:16px 18px;border-radius:10px;overflow:auto;font-size:14px;line-height:1.55;margin:0}
.file{font-size:12px;color:var(--muted);margin:12px 0 -6px;font-family:Consolas,monospace}
.copy{position:absolute;top:8px;right:8px;font-size:12px;background:#ffffff1a;color:#cfd8e3;border:0;border-radius:6px;padding:4px 9px;cursor:pointer}
.copy:hover{background:#ffffff33}
.tk{color:var(--k)} .ts{color:var(--s)} .tc{color:var(--c);font-style:italic} .td{color:var(--d)} .tn{color:var(--n)} .tt{color:var(--t)}
.tdash{color:var(--c)}
ul.tips,ol.tips{padding-left:20px} .tips li{margin:4px 0}
table.ref{border-collapse:collapse;width:100%;font-size:14px;margin:10px 0}
table.ref th,table.ref td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
table.ref th{background:var(--accent-soft);font-weight:600}
.tablewrap{overflow-x:auto}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 8px 8px 0;margin:14px 0;font-size:15px}
.note.exam{border-left-color:var(--warn);background:var(--warn-soft)}
.exercise{margin-top:30px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}
.exercise h3{margin-top:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.exercise h3 .kind{font-size:12px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:1px 10px}
.exercise h3 .badge{font-size:12px;background:var(--ok);color:#fff;border-radius:20px;padding:2px 10px;display:none}
.exercise.solved h3 .badge{display:inline-block}
.exercise.solved{border-color:var(--ok)}
textarea{width:100%;min-height:220px;background:var(--code-bg);color:var(--code-text);border:1px solid var(--line);border-radius:10px;
  padding:14px;font-size:14px;line-height:1.55;resize:vertical;tab-size:2;outline:none;white-space:pre;overflow:auto}
textarea.short{min-height:120px;white-space:pre-wrap}
textarea:focus{border-color:var(--accent)}
.edhelp{font-size:12px;color:var(--muted);margin:4px 0 0}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.small{padding:2px 9px;font-size:13px}
.results{list-style:none;padding:0;margin:10px 0}
.results li{padding:6px 12px;border-radius:7px;margin:4px 0;font-size:14px}
.results li.pass{background:var(--ok-soft);color:var(--ok)}
.results li.fail{background:var(--bad-soft);color:var(--bad)}
.results li .sub{display:block;font-size:13px;margin:2px 0 0 18px;opacity:.9}
.hint{display:none;background:var(--accent-soft);padding:10px 14px;border-radius:8px;font-size:15px;margin:8px 0}
.why{display:none;border-left:3px solid var(--ok);background:var(--ok-soft);padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:15px}
.solution{display:none;margin:10px 0}
.solution .solhead{font-size:13px;color:var(--muted);font-weight:600;margin:0 0 6px}
/* choice */
.opts{display:grid;gap:8px;margin:12px 0}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--bg)}
.opt:hover{border-color:var(--accent)}
.opt input{margin-top:5px;flex:0 0 auto}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
/* order */
.order{list-style:none;padding:0;margin:12px 0;display:grid;gap:6px}
.order li{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg)}
.order li .pos{flex:0 0 24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:12px;font-weight:600}
.order li .txt{flex:1}
.order li .mv{display:flex;gap:4px}
.order li.right{border-color:var(--ok);background:var(--ok-soft)}
.order li.wrong{border-color:var(--bad);background:var(--bad-soft)}
/* match */
.match{width:100%;border-collapse:collapse;margin:12px 0;font-size:15px}
.match td{border-bottom:1px solid var(--line);padding:8px 6px;vertical-align:middle}
.match td:first-child{width:58%}
.match select{width:100%;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:14px}
.match tr.right td{background:var(--ok-soft)}
.match tr.wrong td{background:var(--bad-soft)}
/* fill */
.fill{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:12px 0;line-height:2.3}
.fill.mono{font-family:"Cascadia Code",Consolas,"SF Mono",Menlo,monospace;font-size:14px;white-space:pre-wrap;line-height:2.2}
.fill input{font:inherit;font-size:14px;padding:2px 8px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--text);min-width:90px}
.fill input.right{border-color:var(--ok);background:var(--ok-soft)}
.fill input.wrong{border-color:var(--bad);background:var(--bad-soft)}
/* lines */
.lines{background:var(--code-bg);border-radius:10px;padding:8px 0;margin:12px 0;overflow:auto}
.lines .ln{display:flex;gap:12px;padding:2px 14px;cursor:pointer;color:var(--code-text);font-family:"Cascadia Code",Consolas,"SF Mono",Menlo,monospace;font-size:14px;white-space:pre;border-left:3px solid transparent}
.lines .ln:hover{background:#ffffff12}
.lines .ln .no{color:var(--c);user-select:none;min-width:20px;text-align:right}
.lines .ln.sel{background:#f2b88026;border-left-color:var(--s)}
.lines .ln.right{background:#4cc27a2e;border-left-color:var(--n)}
.lines .ln.wrong{background:#ff7b7230;border-left-color:#ff7b72}
.lines.prose .ln{font-family:inherit;white-space:normal}
.navfoot{display:flex;justify-content:space-between;margin-top:30px}
.menu{display:none}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  aside{position:fixed;inset:0 30% 0 0;z-index:5;transform:translateX(-105%);transition:transform .2s;height:100vh}
  aside.open{transform:none;box-shadow:0 0 40px #0006}
  main{padding:16px 16px 60px}
  .menu{display:inline-block;margin-bottom:12px}
  h2{font-size:23px}
  .match td{display:block;width:100% !important;border:0;padding:4px 6px}
  .match tr{display:block;border-bottom:1px solid var(--line);padding:6px 0}
}
</style>
</head>
<body>
<div class="app">
  <aside id="side">
    <h1>Pipeline Maintenance Lab</h1>
    <p class="sub">AZ-400 · 3.8 Maintaining pipelines</p>
    <div class="progress"><div id="bar"></div></div>
    <p class="ptext" id="ptext"></p>
    <nav id="nav"></nav>
    <div class="sidefoot">
      <button class="theme" id="themeBtn">Toggle theme</button>
      <button class="theme" id="resetAllBtn">Reset progress</button>
      <a href="../azure-pipelines-tutorial/index.html">Open the Azure Pipelines Practice Lab</a>
      <a href="../I.1%20-%20flow-of-work-trainer/index.html">Open the Flow of Work Practice Lab</a>
    </div>
  </aside>
  <main>
    <button class="btn menu" id="menuBtn">☰ Modules</button>
    <div id="content"></div>
  </main>
</div>

<script>
/* ===================================================================
   MODULE DATA  (AZ-400 3.8 Maintaining pipelines)
   Exercise types (all share: id, title, q, hint, why):
     mc     options[], answer: index
     multi  options[], answer: [indexes]           (select all that apply)
     order  items[] in the CORRECT order (shown shuffled)
     match  rows: [[left html, correct choice]], choices[]
     fill   tpl with [[0]], [[1]]… blanks, blanks: [[accepted…]]  (first = shown in solution)
     lines  code: [lines], answer: [line indexes]  (click the faulty lines)
     text   lang: "yaml" | "text", starter, checks: [{l, t: api => bool}], solution
            yaml → api is the YAML query api (h, item, count, first, src)
            text → api is { src, lines }
   =================================================================== */
const STEP = /^(jobs\[\]\.)?steps\[\]\.(script|bash|pwsh|powershell)$/;   // Azure script-like steps
const MODULES = [
/* ================================================================ 1 */
{
  group:"Observe",
  title:"Pipeline health & analytics",
  tag:"pass rate · duration · failure trend · test failures",
  intro:`You can't optimise what you don't measure. A healthy pipeline is <b>reliable</b> (high pass rate, failures caused by real defects), <b>fast</b> (stable or falling duration, short queue time) and <b>trustworthy</b> (no flaky tests that teach people to ignore red builds). Azure Pipelines has these reports built in.`,
  sections:[
    {h:"The Analytics tab of a pipeline", p:`Open a pipeline and select <b>Analytics</b>. It shows summary cards for pass rate and duration; select a card to open the full report. Reports are built from the pipeline's runs, default to the <b>last 14 days</b>, and can be filtered by <b>date range</b> and <b>branch</b>.`,
     after:`<div class="tablewrap"><table class="ref">
<tr><th>Report</th><th>What it shows</th><th>Use it to…</th></tr>
<tr><td><b>Pipeline pass rate</b></td><td>Summary pass rate · <b>Failure trend</b> (failures per day, split by stage) · <b>Top failing tasks</b> and their failed runs</td><td>find the task that breaks most runs and fix it first</td></tr>
<tr><td><b>Pipeline duration</b></td><td>How long successful runs take · duration trend · <b>top tasks by duration</b></td><td>see where the time goes before optimising</td></tr>
<tr><td><b>Test failures</b></td><td>Top failing tests in the pipeline with failure details</td><td>spot unstable or regressing tests</td></tr>
</table></div>`},
    {h:"Signals worth watching", lang:"text", code:`Failure rate      failed runs / all runs        → fix top failing tasks
Duration          trend of successful runs      → cache, parallelise, cut work
Queue time        waiting for a free agent      → parallel jobs / pool capacity
Flaky tests       pass and fail on same code    → flaky test management
Test pass rate    passed / total tests          → watch drops after merges`,
     after:`<p>Beyond the built-in reports, the <b>Analytics</b> service exposes pipeline and test data for dashboards widgets, OData queries and Power BI. In GitHub Actions, each workflow's run history shows status and duration per run, and you can re-run failed jobs from a run.</p>`}
  ],
  tip:`"Which task causes most failures?" → <b>Pipeline pass rate</b> report (top failing tasks). "Why is the pipeline slower?" → <b>Pipeline duration</b> report (top tasks by duration). "Which tests fail most?" → <b>Test failures</b> report. All live on the pipeline's <b>Analytics</b> tab.`,
  exercises:[
    {id:"ph1", type:"match", title:"Which report answers it?",
     q:`Match each question to the Azure Pipelines report that answers it.`,
     choices:["Pipeline pass rate","Pipeline duration","Test failures"],
     rows:[
       ["Which task makes most of our runs fail?","Pipeline pass rate"],
       ["How many runs failed per day, split by stage?","Pipeline pass rate"],
       ["Which tasks take the most time in a successful run?","Pipeline duration"],
       ["Has our typical run time crept up over the last month?","Pipeline duration"],
       ["Which individual tests fail most often, and with what error?","Test failures"]
     ],
     hint:`Pass rate = failures and failing tasks. Duration = time. Test failures = tests.`,
     why:`The pass rate report contains the summary, the failure trend (per day, per stage) and the top failing tasks. The duration report shows the duration trend and top tasks by duration. The test failures report lists the top failing tests with their failure details.`},
    {id:"ph2", type:"mc", title:"Where do you start?",
     q:`Developers complain that the CI pipeline on <code>main</code> "got slow" over the past month. Before changing anything, you want data on which part of the pipeline grew. What do you open first?`,
     options:[
       "The Pipeline pass rate report, filtered to the last 30 days",
       "The Pipeline duration report on the pipeline's Analytics tab, filtered to main and a 30-day range",
       "The agent pool's capabilities page",
       "The project's retention settings"
     ], answer:1,
     hint:`You want time, per task, over a period, for one branch.`,
     why:`The Pipeline duration report shows the duration trend and the top tasks by duration, and you can change the default 14-day range and filter by branch. That tells you which step to optimise before you touch caching or parallelism.`},
    {id:"ph3", type:"fill", title:"Know your reports",
     q:`Complete the sentences about Azure Pipelines reports.`,
     tpl:`Pipeline reports are on the pipeline's [[0]] tab. By default they show the last [[1]] days of runs, and you can filter them by date range and by [[2]]. The pass rate report lists the top failing [[3]] so you know what to fix first.`,
     blanks:[["Analytics"],["14","fourteen"],["branch","branches"],["tasks","task"]],
     hint:`The tab name is the same word as the Azure DevOps reporting service. The default window is two weeks.`,
     why:`Reports live on the <b>Analytics</b> tab, default to <b>14</b> days, filter by date range and <b>branch</b>, and the pass rate report highlights the top failing <b>tasks</b> with links to their failed runs.`},
    {id:"ph4", type:"multi", title:"Health signals",
     q:`Which of these are useful signals of CI/CD pipeline health? <i>Select all that apply.</i>`,
     options:[
       "Run failure rate (or pass rate) over time",
       "Duration trend of successful runs",
       "Time runs spend queued waiting for an agent",
       "Number of tests that pass and fail on the same code (flaky tests)",
       "Number of lines in azure-pipelines.yml",
       "Number of branches in the repository"
     ], answer:[0,1,2,3],
     hint:`Pick the ones that tell you if the pipeline is reliable, fast and trustworthy.`,
     why:`Failure rate, duration, queue time and flakiness each point at a fix: failing tasks, slow steps, too few parallel jobs/agents, or unreliable tests. The size of the YAML file or the number of branches says nothing about pipeline health.`}
  ]
},
/* ================================================================ 2 */
{
  group:"Observe",
  title:"Flaky tests",
  tag:"detection · marking · reruns · pass rate",
  intro:`A <b>flaky test</b> produces different outcomes (pass or fail) <b>without any change</b> to the code or the execution environment. Flaky tests hide real failures and train people to ignore red builds. Azure DevOps has built-in <b>flaky test management</b> (Azure DevOps Services).`,
  sections:[
    {h:"Turn it on", p:`<b>Project settings → Test management</b> (in the Pipelines section) → switch flaky test detection <b>On</b>. Then choose how flaky tests are detected and reported.`,
     after:`<div class="tablewrap"><table class="ref">
<tr><th>Setting</th><th>Meaning</th></tr>
<tr><td><b>System detection</b></td><td>A test that fails and then passes on a <b>rerun in the same pipeline run</b> is marked flaky. Works with the <b>VSTest</b> task's rerun of failed tests, or when you select <b>Rerun failed jobs</b> on a run.</td></tr>
<tr><td><b>Custom detection</b></td><td>Your own system decides and reports flakiness through the Test Results <b>Result Meta Data – Update</b> REST API.</td></tr>
<tr><td><b>Flaky test options</b></td><td>By default flaky tests are <b>included</b> in the test summary (the <i>Flaky</i> tag is for troubleshooting only). If you choose not to include them, flaky tests (passed and failed) are removed from the <b>pass percentage</b> and shown under <b>Tests not reported</b>, so a flaky failure doesn't fail the pipeline. This applies to the VSTest and Publish Test Results tasks.</td></tr>
</table></div>
<p>Once a test is marked flaky, that data is available to <b>all pipelines for that branch</b>. You can manually mark a test <b>Flaky</b> or <b>UnFlaky</b> from its result; the change only affects <b>future runs</b>, not the current one. Switching between system and custom detection erases the stored flakiness history.</p>`},
    {h:"Rerun failed tests with VSTest", lang:"yaml", code:`- task: VSTest@2
  inputs:
    testSelector: testAssemblies
    testAssemblyVer2: |
      **/*Tests.dll
      !**/obj/**
    rerunFailedTests: true     # rerun only the failed tests
    rerunMaxAttempts: 3        # how many times to retry them`},
  ],
  tip:`Flaky = <b>different result, same code</b>. Detection in Azure DevOps = <b>rerun</b> (VSTest rerun or rerun failed jobs) → pass on rerun ⇒ flaky. To stop flaky failures from failing the build, <b>exclude flaky tests from the test summary</b> (pass percentage). Reruns and exclusion are a stopgap: the real fix is to repair or quarantine the test, tracked as a bug.`,
  exercises:[
    {id:"ft1", type:"mc", title:"How system detection decides",
     q:`With flaky test management set to <b>System detection</b>, when does Azure DevOps mark a test as flaky?`,
     options:[
       "When the test fails in two consecutive pipeline runs",
       "When the test fails first and then passes on a rerun within the same pipeline run",
       "When the test takes more than twice its average duration",
       "When a developer adds the [Flaky] attribute to the test method"
     ], answer:1,
     hint:`Flaky means the same code gave two different outcomes.`,
     why:`System detection relies on reruns: the VSTest task rerunning failed tests in the same task execution, or someone selecting <b>Rerun failed jobs</b>. A test that fails and then passes on the rerun, with the same code, is flaky. Two consecutive failures look like a real regression.`},
    {id:"ft2", type:"text", lang:"yaml", title:"Rerun failed tests",
     q:`Write a <code>VSTest@2</code> step that runs all <code>*Tests.dll</code> assemblies (exclude anything under <code>obj</code>), <b>reruns failed tests</b>, and retries them at most <b>2</b> times.`,
     starter:`steps:
`,
     checks:[
       {l:"A VSTest task step", t:a => a.item("steps",{task:/^VSTest@[23]$/i})},
       {l:"Selects test assemblies matching *Tests.dll", t:a => a.item("steps",{task:/^VSTest@/i,"inputs.testAssemblyVer2":/\*Tests\.dll/i})},
       {l:"Excludes obj folders with a ! pattern", t:a => a.item("steps",{task:/^VSTest@/i,"inputs.testAssemblyVer2":/!\*\*[\\/]obj[\\/]/i})},
       {l:"rerunFailedTests: true", t:a => a.item("steps",{task:/^VSTest@/i,"inputs.rerunFailedTests":"true"})},
       {l:"rerunMaxAttempts: 2", t:a => a.item("steps",{task:/^VSTest@/i,"inputs.rerunMaxAttempts":"2"})}
     ],
     hint:`Inputs go under <code>inputs:</code>. Use a block scalar (<code>|</code>) for several assembly patterns, one per line.`,
     solution:`steps:
- task: VSTest@2
  inputs:
    testSelector: testAssemblies
    testAssemblyVer2: |
      **/*Tests.dll
      !**/obj/**
    rerunFailedTests: true
    rerunMaxAttempts: 2`,
     why:`<code>rerunFailedTests</code> makes VSTest rerun only the failed tests, up to <code>rerunMaxAttempts</code> times. With flaky test management on, a test that passes on a rerun is flagged flaky, so you get both a green build and the data to go and fix the test.`},
    {id:"ft3", type:"mc", title:"Keep flaky failures out of the result",
     q:`Flaky test management is on and several known-flaky tests keep failing your pipeline. What happens if you set the <b>Flaky test options</b> so flaky tests are <b>not</b> included in the test summary?`,
     options:[
       "Flaky tests are deleted from the test run",
       "Flaky tests (passed and failed) are removed from the pass percentage and shown under Tests not reported, so their failures don't fail the pipeline",
       "Flaky tests are automatically rerun until they pass",
       "The pipeline fails whenever any flaky test runs"
     ], answer:1,
     hint:`The tests still run and still report; only the summary changes.`,
     why:`Excluding flaky tests from the summary removes them from the pass percentage and lists them under <b>Tests not reported</b>. The summary is updated for the VSTest and Publish Test Results tasks; other scenarios may need a custom script. The default is to include them and use the Flaky tag only for troubleshooting.`},
    {id:"ft4", type:"order", title:"Life of a flaky test",
     q:`Put the lifecycle of a flaky test in order.`,
     items:[
       "Turn on flaky test detection in Project settings → Test management",
       "A test fails, then passes when VSTest reruns it in the same run",
       "The test is tagged Flaky for all pipelines on that branch",
       "A bug is filed and the test's race condition is fixed",
       "Someone marks the test UnFlaky; future runs treat it as a normal test again"
     ],
     hint:`Detection needs to be enabled before anything can be detected; unmarking comes after the fix.`,
     why:`Enable → detect (fail then pass on rerun) → flag (shared across pipelines for that branch) → resolve (bug + fix) → close the loop (unmark). Marking or unmarking only affects future runs, never the run you are looking at.`},
    {id:"ft5", type:"multi", title:"Flaky facts",
     q:`Which statements about flaky test management in Azure DevOps are true? <i>Select all that apply.</i>`,
     options:[
       "Marking a test as flaky or unflaky affects only future runs, not the current one",
       "Once marked flaky, the flakiness data is available to all pipelines for that branch",
       "Switching between system and custom detection erases the stored flakiness history",
       "Custom detection reports flakiness through a REST API",
       "Marking a test flaky permanently removes it from the test assembly",
       "Flaky test detection only works for manual test plans"
     ], answer:[0,1,2,3],
     hint:`Two options describe things the feature never does to your code or test plans.`,
     why:`All four true statements come straight from how the feature works: future-run effect, branch-wide data, history reset on switching, and the Result Meta Data – Update API for custom detection. Azure DevOps never edits your test code, and flaky detection is about automated tests in pipelines.`}

{
  group:"Optimize",
  title:"Caching dependencies",
  tag:"Cache@2 · actions/cache · keys · restore keys",
  intro:`Restoring packages from the network on every run is often the slowest part of a build. A <b>cache</b> saves a folder (npm, NuGet, Maven, pip…) at the end of a job under a <b>key</b>, and restores it at the start of the next run when the key matches. Caching is about <b>speed</b>: the job must still work if there is no cache.`,
  sections:[
    {h:"Azure Pipelines: the Cache task", file:"azure-pipelines.yml", lang:"yaml", code:`variables:
  npm_config_cache: $(Pipeline.Workspace)/.npm   # move npm's cache folder

steps:
- task: Cache@2
  inputs:
    key: 'npm | "$(Agent.OS)" | package-lock.json'   # segments joined by |
    restoreKeys: |                                   # prefix fallbacks, one per line
      npm | "$(Agent.OS)"
    path: $(npm_config_cache)
    cacheHitVar: NPM_CACHE_RESTORED                  # true | inexact | false
- script: npm ci`,
     after:`<ul class="tips">
<li><b>key</b>: strings, file paths and file patterns separated by <code>|</code>. File contents are <b>hashed</b>, so the key changes when <code>package-lock.json</code> changes.</li>
<li><b>restoreKeys</b>: prefix fallbacks tried top to bottom when the exact key misses (partial hit, most recent cache wins).</li>
<li>The cache is saved by an automatic <b>Post-job: Cache</b> step after all steps succeed.</li>
<li>Caches are <b>immutable</b>: a key, once saved for a scope, is never updated. There is no "clear cache"; change the key (e.g. add <code>version2 |</code>).</li>
<li>Caches expire after <b>7 days of no activity</b>. Scopes: one pipeline can't read another pipeline's caches; PR runs can <b>read</b> the target branch's cache but can't <b>write</b> to it.</li>
<li>With <code>npm ci</code>, cache npm's cache folder, <b>not</b> <code>node_modules</code> (<code>npm ci</code> deletes <code>node_modules</code>).</li>
</ul>`},
    {h:"GitHub Actions: actions/cache", file:".github/workflows/ci.yml", lang:"yaml", code:`- uses: actions/cache@v4
  id: npm-cache
  with:
    path: ~/.npm
    key: \${{ runner.os }}-npm-\${{ hashFiles('**/package-lock.json') }}
    restore-keys: |
      \${{ runner.os }}-npm-
- run: npm ci

# or let the setup action do it:
- uses: actions/setup-node@v4
  with:
    node-version: 20
    cache: npm`,
     after:`<p><code>steps.npm-cache.outputs.cache-hit</code> is <code>'true'</code> only on an exact key match. GitHub removes cache entries not accessed in over <b>7 days</b>; the repository cache limit is <b>10 GB by default</b> (it can be increased). A run can restore caches from the <b>current branch or the default branch</b> (PRs also from the base branch), but not from sibling or child branches.</p>`},
    {h:"Cache or artifact?", after:`<div class="tablewrap"><table class="ref">
<tr><th></th><th>Pipeline caching</th><th>Pipeline artifacts</th></tr>
<tr><td>Purpose</td><td>Speed up runs by reusing files from <b>previous runs</b></td><td>Pass files produced by one job to <b>other jobs/stages</b></td></tr>
<tr><td>If missing</td><td>Job still works, just slower</td><td>Downstream job would fail</td></tr>
</table></div>`}
  ],
  tip:`Good cache key = <b>tool + OS + hash of the lock file</b>, with a restore key fallback. "Share the build output with the deploy stage" is <b>not</b> caching: use <b>pipeline artifacts</b>. Cache "never updates" ⇒ the key is fixed (no lock-file hash).`,
  exercises:[
    {id:"ca1", type:"text", lang:"yaml", title:"Cache npm in Azure Pipelines",
     q:`Write the YAML so that:
      <ul class="tips">
        <li>a variable <code>npm_config_cache</code> points to <code>$(Pipeline.Workspace)/.npm</code></li>
        <li>a <code>Cache@2</code> step caches that folder with a key built from <code>npm</code>, the agent OS and <code>package-lock.json</code></li>
        <li>a restore key falls back to <code>npm | "$(Agent.OS)"</code></li>
        <li>then <code>npm ci</code> runs</li>
      </ul>`,
     starter:`pool:
  vmImage: ubuntu-latest

`,
     checks:[
       {l:"Variable npm_config_cache under $(Pipeline.Workspace)", t:a => a.h("variables.npm_config_cache",/Pipeline\.Workspace\)\/\.npm/) || a.item("variables",{name:/^npm_config_cache$/,value:/Pipeline\.Workspace\)\/\.npm/})},
       {l:"A Cache@2 step", t:a => a.item("steps",{task:/^Cache@2$/i})},
       {l:"key hashes package-lock.json", t:a => a.item("steps",{task:/^Cache@2$/i,"inputs.key":/\|\s*package-lock\.json\s*$/})},
       {l:"key includes the agent OS", t:a => a.item("steps",{task:/^Cache@2$/i,"inputs.key":/\$\(Agent\.OS\)/})},
       {l:"restoreKeys fallback without the lock file", t:a => a.item("steps",{task:/^Cache@2$/i,"inputs.restoreKeys":/npm\s*\|\s*"?\$\(Agent\.OS\)"?/}) && !a.item("steps",{task:/^Cache@2$/i,"inputs.restoreKeys":/package-lock/})},
       {l:"path is the npm cache folder (not node_modules)", t:a => a.item("steps",{task:/^Cache@2$/i,"inputs.path":/^(\$\(npm_config_cache\)|\$\(Pipeline\.Workspace\)\/\.npm)$/})},
       {l:"npm ci runs after the cache step", t:a => a.h(STEP,/^npm ci\b/) && a.first("steps[].task",/^Cache@2$/i) < a.first(STEP,/^npm ci\b/)}
     ],
     hint:`Quote the key so YAML doesn't mind the <code>|</code> and <code>"</code> characters: <code>key: 'npm | "$(Agent.OS)" | package-lock.json'</code>. <code>restoreKeys</code> is a block scalar.`,
     solution:`pool:
  vmImage: ubuntu-latest

variables:
  npm_config_cache: $(Pipeline.Workspace)/.npm

steps:
- task: Cache@2
  displayName: Cache npm
  inputs:
    key: 'npm | "$(Agent.OS)" | package-lock.json'
    restoreKeys: |
      npm | "$(Agent.OS)"
    path: $(npm_config_cache)
- script: npm ci`,
     why:`Hashing <code>package-lock.json</code> gives a new cache whenever dependencies change, the OS segment keeps Linux and Windows caches apart, and the restore key gives a partial hit after a lock-file change so <code>npm ci</code> only downloads what's new. Caching npm's cache folder (not <code>node_modules</code>) is the documented approach because <code>npm ci</code> deletes <code>node_modules</code>.`},
    {id:"ca2", type:"text", lang:"yaml", title:"Cache npm in GitHub Actions",
     q:`Add an <code>actions/cache</code> step (id <code>npm-cache</code>) before <code>npm ci</code> that caches <code>~/.npm</code> with a key made of the runner OS and a hash of all <code>package-lock.json</code> files, plus a restore key on the OS prefix.`,
     starter:`name: CI
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # add the cache step here
      - run: npm ci
      - run: npm test
`,
     checks:[
       {l:"An actions/cache step", t:a => a.item("jobs.*.steps",{uses:/^actions\/cache@v\d+$/})},
       {l:"id: npm-cache", t:a => a.item("jobs.*.steps",{uses:/^actions\/cache@/,id:"npm-cache"})},
       {l:"path: ~/.npm", t:a => a.item("jobs.*.steps",{uses:/^actions\/cache@/,"with.path":/^~\/\.npm\/?$/})},
       {l:"key uses hashFiles on package-lock.json", t:a => a.item("jobs.*.steps",{uses:/^actions\/cache@/,"with.key":/hashFiles\(\s*'[^']*package-lock\.json'\s*\)/})},
       {l:"key includes runner.os", t:a => a.item("jobs.*.steps",{uses:/^actions\/cache@/,"with.key":/runner\.os/})},
       {l:"restore-keys with an OS-based prefix", t:a => a.item("jobs.*.steps",{uses:/^actions\/cache@/,"with.restore-keys":/runner\.os/}) && !a.item("jobs.*.steps",{uses:/^actions\/cache@/,"with.restore-keys":/hashFiles/})},
       {l:"Cache step comes before npm ci", t:a => a.h("jobs.*.steps[].run",/^npm ci\b/) && a.first("jobs.*.steps[].uses",/^actions\/cache@/) <a.first("jobs.*.steps[].run",/^npm ci\b/)}
     ],
     hint:`Expressions go in <code>\${{ }}</code>: <code>\${{ runner.os }}-npm-\${{ hashFiles('**/package-lock.json') }}</code>.`,
     solution:`name: CI
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: npm-cache
        with:
          path: ~/.npm
          key: \${{ runner.os }}-npm-\${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            \${{ runner.os }}-npm-
      - run: npm ci
      - run: npm test`,
     why:`Same idea as <code>Cache@2</code>: exact key from OS + lock-file hash, prefix fallback in <code>restore-keys</code>. The <code>id</code> lets later steps read <code>steps.npm-cache.outputs.cache-hit</code>. For npm alone, <code>actions/setup-node</code> with <code>cache: npm</code> does the same with less YAML.`},
    {id:"ca3", type:"mc", title:"Cache or artifact?",
     q:`A multi-stage pipeline builds a web app in the <b>Build</b> stage. The <b>Deploy</b> stage must deploy exactly those compiled files. What should carry the files from Build to Deploy?`,
     options:[
       "A Cache@2 step in both stages with the same key",
       "A pipeline artifact: publish in Build, download in Deploy",
       "A shallow fetch in the Deploy stage",
       "A retention lease on the Build stage"
     ], answer:1,
     hint:`Would Deploy fail if the files were missing?`,
     why:`Pipeline artifacts are for files one job produces and another job needs; without them the next job fails. Caches are a best-effort speed-up for reusing files across runs and can miss at any time, so they must never be the only way to pass build output.`},
    {id:"ca4", type:"multi", title:"Azure Pipelines caching rules",
     q:`Which statements about Azure Pipelines caching (<code>Cache@2</code>) are true? <i>Select all that apply.</i>`,
     options:[
       "A cache is immutable: once saved for a key and scope, it isn't updated",
       "Caches expire after seven days of no activity",
       "A pull request run can read the target branch's cache but can't write to it",
       "To force a fresh cache, change the key, for example by adding a version string",
       "A pipeline can read caches created by any other pipeline in the project",
       "There is a Clear cache button on the pipeline's settings page"
     ], answer:[0,1,2,3],
     hint:`Caches are scoped by pipeline and branch, and clearing isn't supported.`,
     why:`Caches are immutable, expire after 7 days unused, and are scoped: jobs from one pipeline can't access another pipeline's caches, and PR runs read (but don't write) the target branch scope. Clearing isn't supported, so you change the key (e.g. <code>version2 | yarn | …</code>).`},
    {id:"ca5", type:"lines", title:"Why does the cache never help?",
     q:`This job uses <code>npm ci</code>, but the cache step either restores stale files or is wiped every run. Click the <b>two</b> faulty lines.`,
     code:[
       "variables:",
       "  npm_config_cache: $(Pipeline.Workspace)/.npm",
       "steps:",
       "- task: Cache@2",
       "  inputs:",
       "    key: 'npm | \"$(Agent.OS)\"'",
       "    restoreKeys: |",
       "      npm",
       "    path: $(Build.SourcesDirectory)/node_modules",
       "- script: npm ci"
     ], answer:[5,8],
     hint:`One line makes the key never change when dependencies change. The other caches a folder that <code>npm ci</code> deletes.`,
     why:`Without the hash of <code>package-lock.json</code>, the key is fixed: the first cache saved is immutable and is restored forever, even after dependencies change. And <code>npm ci</code> deletes <code>node_modules</code> before installing, so caching it is wasted; cache <code>$(npm_config_cache)</code> instead.`}
  ]
},

{
  group:"Optimize",
  title:"Do less work per run",
  tag:"shallow fetch · path filters · skip · batch · incremental",
  intro:`The fastest step is the one that doesn't run. Fetch less history, trigger only when relevant files change, collapse bursts of pushes into one run, cancel superseded PR runs, and let self-hosted agents reuse work from the previous build.`,
  sections:[
    {h:"Azure Pipelines", file:"azure-pipelines.yml", lang:"yaml", code:`trigger:
  batch: true                 # while a run is in progress, batch new pushes into one run
  branches:
    include: [ main ]
  paths:
    include: [ src ]
    exclude: [ src/docs ]

pr:
  autoCancel: true            # default: a new push cancels the running PR build
  branches:
    include: [ main ]

steps:
- checkout: self
  fetchDepth: 1               # shallow fetch: only the latest commit
  fetchTags: false`,
     after:`<ul class="tips">
<li>New YAML pipelines created after the September 2022 update have <b>shallow fetch with depth 1</b> enabled by default. Tools that need history (GitVersion, <code>git describe</code>) need a deeper or full fetch.</li>
<li>Put <code>[skip ci]</code> (or <code>[ci skip]</code>, <code>***NO_CI***</code>) in a commit message to skip the CI trigger for that push.</li>
<li><code>pr:</code> triggers apply to GitHub and Bitbucket repos. For <b>Azure Repos</b>, PR builds come from a <b>Build validation</b> branch policy, which has its own path filter.</li>
<li><b>Incremental builds</b>: a self-hosted agent keeps the workspace between runs, so compilers and package managers can reuse previous output. <code>workspace: clean: all</code> on the job throws that away; use it only when stale files cause problems.</li>
</ul>`},
    {h:"GitHub Actions", file:".github/workflows/ci.yml", lang:"yaml", code:`on:
  push:
    branches: [ main ]
    paths-ignore:             # or 'paths:' – not both for the same event
      - 'docs/**'
  pull_request:
    paths:
      - 'src/**'
      - '!src/**/*.md'        # negative pattern inside 'paths'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # default fetch-depth: 1
        with:
          fetch-depth: 0            # only if you need full history and tags`,
     after:`<p>Watch out: if a workflow is <b>skipped by a path filter</b>, its checks stay <b>Pending</b>, so a pull request that <b>requires</b> that check can't be merged. <code>[skip ci]</code>, <code>[ci skip]</code>, <code>[no ci]</code>, <code>[skip actions]</code> or <code>[actions skip]</code> in a commit message skips <code>push</code> and <code>pull_request</code> workflow runs.</p>`}
  ],
  tip:`Large repo with long history, slow checkout → <b>shallow fetch</b> (<code>fetchDepth: 1</code> / <code>fetch-depth: 1</code>). Doc-only changes trigger builds → <b>path filters</b>. Many pushes in a row → <b>batch: true</b> (Azure) or a <b>concurrency group</b> (GitHub). Superseded PR runs → <b>autoCancel</b> / <b>cancel-in-progress</b>.`,
  exercises:[
    {id:"lw1", type:"text", lang:"yaml", title:"Trigger only on relevant changes",
     q:`Write the start of an Azure Pipelines YAML file so that:
      <ul class="tips">
        <li>CI runs for pushes to <code>main</code> only</li>
        <li>only when something under <code>src</code> changes, but <b>not</b> when the change is only under <code>src/docs</code></li>
        <li>the checkout fetches only the latest commit</li>
      </ul>`,
     starter:`pool:
  vmImage: ubuntu-latest

# trigger here

steps:
# checkout here
- script: dotnet build src/App.sln
`,
     checks:[
       {l:"trigger.branches.include has main", t:a => a.h("trigger.branches.include[]?","main")},
       {l:"trigger.paths.include has src", t:a => a.h("trigger.paths.include[]?",/^\/?src(\/\*{0,2})?\/?$/)},
       {l:"trigger.paths.exclude has src/docs", t:a => a.h("trigger.paths.exclude[]?",/^\/?src\/docs(\/\*{0,2})?\/?$/)},
       {l:"checkout: self with fetchDepth: 1", t:a => a.item("steps",{checkout:"self",fetchDepth:"1"})},
       {l:"checkout comes before the build", t:a => a.h(STEP,/dotnet build/) && a.first("steps[].checkout") <a.first(STEP,/dotnet build/)}
     ],
     hint:`<code>trigger:</code> takes <code>branches:</code> and <code>paths:</code>, each with <code>include:</code> / <code>exclude:</code> lists. The shallow fetch setting sits on the <code>- checkout: self</code> step.`,
     solution:`pool:
  vmImage: ubuntu-latest

trigger:
  branches:
    include:
    - main
  paths:
    include:
    - src
    exclude:
    - src/docs

steps:
- checkout: self
  fetchDepth: 1
- script: dotnet build src/App.sln`,
     why:`Path filters stop runs for changes the build doesn't care about, and the exclude wins for the more specific folder. <code>fetchDepth: 1</code> downloads only the tip commit, which matters a lot for repositories with years of history (it's already the default for YAML pipelines created after September 2022).`},
    {id:"lw2", type:"fill", title:"GitHub: filter and fetch", mono:true,
     q:`Complete the workflow: don't run on pushes that only touch <code>docs/</code>, and fetch the <b>full</b> history because GitVersion needs it.`,
     tpl:`on:
  push:
    branches: [ main ]
    [[0]]:
      - 'docs/**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: [[1]]

# A single commit can skip push and pull_request runs with
# this text in its message: [[2]]`,
     blanks:[["paths-ignore"],["0"],["[skip ci]","[ci skip]","[no ci]","[skip actions]","[actions skip]"]],
     hint:`The ignore filter's name mirrors <code>branches-ignore</code>. For actions/checkout, a depth of zero means "everything".`,
     why:`<code>paths-ignore</code> skips the run when <b>all</b> changed files match the patterns. <code>actions/checkout</code> fetches one commit by default; <code>fetch-depth: 0</code> fetches all history and tags. <code>[skip ci]</code> (and its variants) in the commit message skips <code>push</code> and <code>pull_request</code> runs.`},
    {id:"lw3", type:"mc", title:"The PR that can't merge",
     q:`The CI workflow has <code>on: pull_request: paths: ['src/**']</code>, and its <code>build</code> job is a <b>required status check</b> on <code>main</code>. A PR that only edits <code>README.md</code> can't be merged. Why?`,
     options:[
       "Required checks don't support pull requests from branches",
       "The workflow was skipped by the path filter, so its check stays Pending and the required check is never satisfied",
       "README.md changes always need two reviewers",
       "paths filters are not supported for pull_request events"
     ], answer:1,
     hint:`A skipped workflow doesn't report success.`,
     why:`When a workflow is skipped because of path filtering, its checks remain <b>Pending</b>, and a PR that requires them is blocked. Options: don't make path-filtered workflows required, or run the workflow always and skip the expensive steps inside it based on what changed.`},
    {id:"lw4", type:"match", title:"Pick the technique",
     q:`Match each problem to the technique that addresses it.`,
     choices:["Shallow fetch","Path filters","batch: true","PR autoCancel / cancel-in-progress","Self-hosted agent with incremental builds","[skip ci] in the commit message"],
     rows:[
       ["Checkout of a 10-year-old monorepo takes 4 minutes","Shallow fetch"],
       ["Editing only documentation starts a 30-minute build","Path filters"],
       ["20 merges to main in an hour each start a full CI run while the previous one is still going","batch: true"],
       ["Each new push to a PR keeps the old, now useless PR build running","PR autoCancel / cancel-in-progress"],
       ["A huge C++ build recompiles everything from scratch on a fresh VM every time","Self-hosted agent with incremental builds"],
       ["A one-off commit that only fixes a typo in a comment shouldn't start CI","[skip ci] in the commit message"]
     ],
     hint:`Each technique removes a different kind of waste: history, irrelevant changes, bursts, stale runs, repeated compilation, one-offs.`,
     why:`Shallow fetch cuts clone time; path filters avoid irrelevant runs; <code>batch: true</code> collapses pushes made while a run is in progress into one run; auto-cancel stops superseded PR builds; a self-hosted agent keeps its workspace so builds can be incremental; <code>[skip ci]</code> skips a single push.`},
    {id:"lw5", type:"lines", title:"Spot the invalid trigger",
     q:`GitHub rejects this workflow. Click the <b>two</b> lines that can't be used together.`,
     code:[
       "on:",
       "  push:",
       "    branches: [ main ]",
       "    paths:",
       "      - 'src/**'",
       "    paths-ignore:",
       "      - 'src/docs/**'",
       "jobs:",
       "  build:",
       "    runs-on: ubuntu-latest",
       "    steps:",
       "      - uses: actions/checkout@v4"
     ], answer:[3,5],
     hint:`One event, two kinds of path filter.`,
     why:`You can't use both <code>paths</code> and <code>paths-ignore</code> for the same event. To include a folder but exclude a sub-folder, use <code>paths</code> with a negative pattern: <code>- 'src/**'</code> and <code>- '!src/docs/**'</code>.`}
  ]
},

{
  group:"Optimize",
  title:"Parallelism, agents & cost",
  tag:"parallel jobs · matrix · maxParallel · hosted vs self-hosted",
  intro:`Parallelism shortens the wall-clock time of a run, but every parallel job needs an agent and, in Azure DevOps, a <b>parallel job</b> licence. Picking the right agent type and avoiding unneeded runs is how you control cost.`,
  sections:[
    {h:"How Azure DevOps charges", after:`<div class="tablewrap"><table class="ref">
<tr><th></th><th>Microsoft-hosted agents</th><th>Self-hosted agents</th></tr>
<tr><td>Billing</td><td>By <b>parallel jobs</b> (how many jobs can run at once). Free tier for private projects: <b>1 parallel job, 1,800 minutes/month</b></td><td>By parallel jobs. Free tier: <b>1 parallel job, unlimited minutes</b>. You also pay for your own machines</td></tr>
<tr><td>Machine</td><td>Fresh VM every job, maintained by Microsoft</td><td>Your VM/container: you patch it, you choose its size and network</td></tr>
<tr><td>Good for</td><td>Zero maintenance, clean builds</td><td>Private network access, special hardware/software, big caches, incremental builds</td></tr>
</table></div>
<p>When more jobs are ready than you have parallel jobs, the rest <b>queue</b>. <b>Managed DevOps Pools</b> is an Azure service that runs agent pools for you (custom images, VNet integration, scaling including standby agents), a middle ground between Microsoft-hosted and fully self-managed agents. In GitHub Actions, GitHub-hosted runners in <b>private</b> repositories use the account's included minutes and are then billed per minute; standard runners for <b>public</b> repositories are free.</p>`},
    {h:"Parallelism inside a run", file:"azure-pipelines.yml", lang:"yaml", code:`jobs:
- job: Test
  strategy:
    matrix:                      # one job per entry
      linux:   { imageName: ubuntu-latest }
      windows: { imageName: windows-latest }
      mac:     { imageName: macOS-latest }
    maxParallel: 2               # at most 2 of these at the same time
  pool:
    vmImage: $(imageName)
  steps:
  - script: npm test

- job: SlicedTests
  strategy:
    parallel: 4                  # 4 copies of the job; split work with
  steps:                         # System.JobPositionInPhase / System.TotalJobsInPhase
  - script: ./run-tests.sh $(System.JobPositionInPhase) $(System.TotalJobsInPhase)`,
     after:`<p>GitHub Actions: <code>strategy.matrix</code>, <code>strategy.max-parallel</code> and <code>strategy.fail-fast</code> (default <code>true</code>: cancel the other matrix jobs when one fails).</p>`}
  ],
  tip:`"Builds queue every morning" → not enough <b>parallel jobs</b> (or agents). "Need access to a private network / special software" → <b>self-hosted</b> or <b>Managed DevOps Pools</b>. "No maintenance, clean machine" → <b>Microsoft-hosted</b>. Limit how many matrix jobs run at once → <b>maxParallel</b> (it doesn't buy capacity).`,
  exercises:[
    {id:"pc1", type:"text", lang:"yaml", title:"Matrix with a parallel limit",
     q:`Write a job <code>Test</code> that runs <code>npm test</code> on <b>Linux, Windows and macOS</b> using a matrix variable <code>imageName</code>, uses that variable as the pool's VM image, and runs <b>at most 2</b> matrix jobs at the same time.`,
     starter:`jobs:
- job: Test
`,
     checks:[
       {l:"Three matrix entries, each setting imageName", t:a => a.count(/(^|\.)strategy\.matrix\.[^.]+\.imageName$/) >= 3},
       {l:"Images cover ubuntu, windows and macOS", t:a => a.h(/strategy\.matrix\.[^.]+\.imageName$/,/^ubuntu/i) && a.h(/strategy\.matrix\.[^.]+\.imageName$/,/^windows/i) && a.h(/strategy\.matrix\.[^.]+\.imageName$/,/^macos/i)},
       {l:"strategy.maxParallel: 2", t:a => a.h(/(^|\.)strategy\.maxParallel$/,"2")},
       {l:"pool.vmImage: $(imageName)", t:a => a.h(/(^|\.)pool\.vmImage$/,/^\$\(imageName\)$/)},
       {l:"Runs npm test", t:a => a.h(/steps\[\]\.(script|bash|pwsh)$/,/npm test/)}
     ],
     hint:`<code>matrix</code> and <code>maxParallel</code> are siblings under <code>strategy</code>. Each matrix entry is a name with its own variables.`,
     solution:`jobs:
- job: Test
  strategy:
    matrix:
      linux:
        imageName: ubuntu-latest
      windows:
        imageName: windows-latest
      mac:
        imageName: macOS-latest
    maxParallel: 2
  pool:
    vmImage: $(imageName)
  steps:
  - script: npm test`,
     why:`The matrix creates three jobs; <code>maxParallel: 2</code> caps how many run at once so one pipeline doesn't take every parallel job and block other teams. It never adds capacity: if the organization has only one parallel job, the jobs still run one at a time.`},
    {id:"pc2", type:"mc", title:"Morning queue",
     q:`An Azure DevOps organization uses Microsoft-hosted agents with <b>one</b> parallel job. Every morning, 8 developers push and runs wait 20–40 minutes in the queue before starting, although each run takes only 6 minutes. What fixes the waiting most directly?`,
     options:[
       "Increase the job's timeoutInMinutes",
       "Buy additional Microsoft-hosted parallel jobs (or add self-hosted capacity with parallel jobs)",
       "Set maxParallel: 8 in the pipeline",
       "Shorten the retention period for runs"
     ], answer:1,
     hint:`The runs are fast. They're waiting, not running.`,
     why:`Queue time means demand exceeds the number of jobs that can run at once. Only more <b>parallel jobs</b> (with agents to run them) reduce it. <code>maxParallel</code> only limits a single run's matrix, and timeouts and retention don't affect queueing.`},
    {id:"pc3", type:"match", title:"Choose the agent",
     q:`Match each requirement to the agent option that fits best.`,
     choices:["Microsoft-hosted agents","Self-hosted agents","Managed DevOps Pools"],
     rows:[
       ["A small team wants clean machines for every job and no infrastructure to maintain","Microsoft-hosted agents"],
       ["The build needs a licensed tool installed on a specific physical machine in the office","Self-hosted agents"],
       ["Agents must reach resources in an Azure virtual network, use a custom image, and scale automatically, without the team managing the agent VMs themselves","Managed DevOps Pools"],
       ["A very large build should reuse its previous output on the same machine (incremental build)","Self-hosted agents"]
     ],
     hint:`Who manages the machine, and does it keep state between runs?`,
     why:`Microsoft-hosted agents are fresh and maintenance-free. Self-hosted agents give full control and keep their workspace (incremental builds, licensed tools). Managed DevOps Pools is the Azure-managed option for custom images, VNet access and autoscaling without running the pool infrastructure yourself.`},
    {id:"pc4", type:"multi", title:"Cut pipeline cost",
     q:`Which changes reduce CI/CD cost without lowering quality? <i>Select all that apply.</i>`,
     options:[
       "Path filters so documentation-only changes don't run the full build",
       "Automatically cancel superseded PR runs",
       "Cache dependencies instead of downloading them every run",
       "Run the 2-hour load test on a nightly schedule instead of on every commit",
       "Run every job on the largest available VM size",
       "Keep every artifact of every run forever"
     ], answer:[0,1,2,3],
     hint:`Look for options that remove waste, not options that add capacity or storage.`,
     why:`Fewer unneeded runs, fewer wasted minutes and less network time all cut cost. Moving slow, low-frequency tests to a schedule keeps them but stops them from blocking every commit. Oversized VMs and unlimited retention increase cost.`},
    {id:"pc5", type:"fill", title:"Slice tests across agents", mono:true,
     q:`Complete the job so the test suite is split into <b>4</b> slices that run in parallel, each script knowing which slice it is.`,
     tpl:`- job: SlicedTests
  strategy:
    [[0]]: 4
  steps:
  - script: ./run-tests.sh --slice $(System.[[1]]) --of $(System.[[2]])`,
     blanks:[["parallel"],["JobPositionInPhase"],["TotalJobsInPhase"]],
     hint:`The strategy keyword is the same word as "running at the same time". The variables describe the job's position and the total number of jobs in the phase.`,
     why:`<code>strategy: parallel: 4</code> runs four copies of the job. Each copy gets <code>System.JobPositionInPhase</code> (1–4) and <code>System.TotalJobsInPhase</code> (4) so it can pick its share of the tests. The VSTest task can use the same mechanism to distribute tests automatically.`}
  ]

{
  group:"Optimize",
  title:"Reliability",
  tag:"retries · timeouts · conditions · isolating failures",
  intro:`A reliable pipeline fails <b>only</b> when something is really wrong, fails <b>fast</b> when it is, and always leaves enough evidence (logs, test results) to find out why.`,
  sections:[
    {h:"Azure Pipelines", file:"azure-pipelines.yml", lang:"yaml", code:`jobs:
- job: IntegrationTests
  timeoutInMinutes: 30          # job timeout (default 60; 0 = maximum allowed)
  cancelTimeoutInMinutes: 5     # time to clean up after cancel
  steps:
  - script: dotnet restore
    retryCountOnTaskFailure: 3  # retry a step that fails for transient reasons
  - script: dotnet test --logger trx
    timeoutInMinutes: 15        # step timeout (the job timeout still wins)
  - task: PublishTestResults@2
    condition: succeededOrFailed()   # publish results even if tests failed
    inputs:
      testResultsFormat: VSTest
      testResultsFiles: '**/*.trx'
  - script: ./notify-team.sh
    condition: failed()
  - script: ./lint.sh
    continueOnError: true       # report as warning, don't fail the job`,
     after:`<div class="tablewrap"><table class="ref">
<tr><th>Azure condition</th><th>Runs when…</th><th>GitHub <code>if:</code></th></tr>
<tr><td><code>succeeded()</code> (default)</td><td>all previous steps succeeded</td><td><code>success()</code> (default)</td></tr>
<tr><td><code>succeededOrFailed()</code></td><td>even if a previous step failed, <b>unless the run was canceled</b></td><td>(<code>!cancelled()</code>)</td></tr>
<tr><td><code>always()</code></td><td>always, <b>even if canceled</b></td><td><code>always()</code></td></tr>
<tr><td><code>failed()</code></td><td>only if a previous step failed</td><td><code>failure()</code></td></tr>
<tr><td><code>canceled()</code></td><td>only if the run was canceled</td><td><code>cancelled()</code></td></tr>
</table></div>
<p>GitHub Actions equivalents: <code>timeout-minutes</code> on a job (default <b>360</b>) or step, <code>continue-on-error: true</code>, and <b>Re-run failed jobs</b> from the run page. <b>Isolate failures</b> by splitting work into separate jobs/stages so a failing lint job doesn't hide test results, and use <code>fail-fast: false</code> in a matrix when you want every combination's result.</p>`}
  ],
  tip:`Transient network failure → <b>retryCountOnTaskFailure</b> on that step only (retrying whole test suites hides flaky tests). Hung step → <b>timeoutInMinutes</b> / <b>timeout-minutes</b>. Publish test results even on failure → <b>succeededOrFailed()</b>. Deploy must only run after success → leave the default <b>succeeded()</b>.`,
  exercises:[
    {id:"rl1", type:"text", lang:"yaml", title:"Make the job resilient",
     q:`Write a job <code>IntegrationTests</code> that:
      <ul class="tips">
        <li>times out after <b>30</b> minutes</li>
        <li>runs <code>dotnet restore</code> and retries it up to <b>3</b> times if it fails</li>
        <li>runs <code>dotnet test --logger trx</code> with a <b>15</b>-minute step timeout</li>
        <li>publishes <code>**/*.trx</code> results with <code>PublishTestResults@2</code> even if the tests failed, but <b>not</b> if the run was canceled</li>
      </ul>`,
     starter:`jobs:
- job: IntegrationTests
`,
     checks:[
       {l:"Job timeoutInMinutes: 30", t:a => a.item("jobs",{job:"IntegrationTests",timeoutInMinutes:"30"})},
       {l:"Restore step with retryCountOnTaskFailure: 3", t:a => a.item("jobs[].steps",{retryCountOnTaskFailure:"3","**":/restore/i})},
       {l:"dotnet test step with timeoutInMinutes: 15", t:a => a.item("jobs[].steps",{timeoutInMinutes:"15","**":/dotnet test|command.*test|^test$/i})},
       {l:"PublishTestResults@2 for **/*.trx", t:a => a.item("jobs[].steps",{task:/^PublishTestResults@2$/i,"inputs.testResultsFiles":/\*\.trx/})},
       {l:"…runs on failure but not on cancel: succeededOrFailed() or not(canceled())", t:a => a.item("jobs[].steps",{task:/^PublishTestResults@2$/i,condition:/^\s*(succeededOrFailed\(\)|not\(\s*canceled\(\)\s*\))\s*$/i})}
     ],
     hint:`<code>timeoutInMinutes</code> exists on both jobs and steps. <code>retryCountOnTaskFailure</code> goes on the step. Which condition skips only on cancel?`,
     solution:`jobs:
- job: IntegrationTests
  timeoutInMinutes: 30
  steps:
  - script: dotnet restore
    retryCountOnTaskFailure: 3
  - script: dotnet test --logger trx
    timeoutInMinutes: 15
  - task: PublishTestResults@2
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: VSTest
      testResultsFiles: '**/*.trx'`,
     why:`Retrying only the network-bound restore step absorbs transient failures without hiding real test failures. Timeouts stop a hung run from holding a parallel job for an hour. <code>succeededOrFailed()</code> (same as <code>not(canceled())</code>) publishes results exactly when someone needs them: after a test failure. <code>always()</code> would also run after a cancel.`},
    {id:"rl2", type:"match", title:"Pick the condition",
     q:`Match each step to the Azure Pipelines condition it needs.`,
     choices:["succeeded()","succeededOrFailed()","always()","failed()"],
     rows:[
       ["Deploy to staging: only if everything before it worked","succeeded()"],
       ["Publish test results, also when tests failed, but skip if someone canceled the run","succeededOrFailed()"],
       ["Delete the temporary test database in every case, even after a cancel","always()"],
       ["Post a message to the team channel only when the build broke","failed()"]
     ],
     hint:`The difference between two of them is only what happens on cancel.`,
     why:`<code>succeeded()</code> is the default. <code>succeededOrFailed()</code> runs after failures but not after a cancel; <code>always()</code> runs even after a cancel, which is what clean-up needs. <code>failed()</code> runs only when a previous step failed.`},
    {id:"rl3", type:"fill", title:"GitHub reliability keys", mono:true,
     q:`Complete the GitHub Actions job: kill it after 20 minutes, let the lint step fail without failing the job, and upload logs only when something failed.`,
     tpl:`jobs:
  test:
    runs-on: ubuntu-latest
    [[0]]: 20
    steps:
      - uses: actions/checkout@v4
      - run: npm run lint
        [[1]]: true
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: \${{ [[2]] }}
        with:
          name: logs
          path: logs/`,
     blanks:[["timeout-minutes"],["continue-on-error"],["failure()"]],
     hint:`GitHub keys are kebab-case. The status function for "a previous step failed" is a noun.`,
     why:`<code>timeout-minutes</code> overrides the 360-minute default, <code>continue-on-error: true</code> lets a step fail without failing the job, and <code>if: failure()</code> runs a step only when a previous step failed.`},
    {id:"rl4", type:"lines", title:"Spot the reliability bugs",
     q:`Click the <b>two</b> lines that make this job behave differently from what the comments say.`,
     code:[
       "jobs:",
       "- job: BuildAndDeploy",
       "  timeoutInMinutes: 10",
       "  steps:",
       "  - script: ./build.sh",
       "    timeoutInMinutes: 30      # the build may take up to 30 minutes",
       "  - script: ./deploy.sh",
       "    condition: always()       # deploy only if the build succeeded",
       "  - script: ./cleanup.sh",
       "    condition: always()       # clean up in every case"
     ], answer:[2,7],
     hint:`Which timeout wins? Which condition runs even after a failure?`,
     why:`The job timeout (10 minutes) kills the job even if a step allows 30, so line 3 must be at least 30. <code>always()</code> on deploy runs it even after a failed build; deploy needs the default <code>succeeded()</code> (just remove the condition). <code>always()</code> is correct for clean-up.`}
  ]
},

{
  group:"Control",
  title:"Concurrency control",
  tag:"concurrency groups · exclusive lock · lockBehavior · queueing",
  intro:`Parallelism makes runs fast; <b>concurrency control</b> stops runs from stepping on each other (two deployments to the same environment) and stops stale runs from wasting agents.`,
  sections:[
    {h:"GitHub Actions: concurrency groups", file:".github/workflows/pr.yml", lang:"yaml", code:`concurrency:
  group: \${{ github.workflow }}-\${{ github.ref }}
  cancel-in-progress: true        # new run cancels the running one in the group

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:                  # job-level group
      group: production
      cancel-in-progress: false   # never interrupt a running deployment`,
     after:`<ul class="tips">
<li>At most <b>one running</b> run/job per group. By default at most <b>one pending</b>: a newer run <b>replaces</b> (cancels) the existing pending one.</li>
<li><code>queue: max</code> lets up to 100 runs wait (FIFO) instead; it can't be combined with <code>cancel-in-progress: true</code>.</li>
<li>Groups can be set at workflow level or <code>jobs.&lt;job_id&gt;.concurrency</code>; group names are case-insensitive.</li>
<li><code>\${{ github.head_ref || github.run_id }}</code> cancels only for pull requests: <code>head_ref</code> exists only for PR events, and <code>run_id</code> is unique for everything else.</li>
</ul>`},
    {h:"Azure Pipelines: exclusive lock", p:`Add the <b>Exclusive lock</b> check to a resource (usually an <b>environment</b>) under <b>Approvals and checks</b>. Then only one run at a time can use it. <code>lockBehavior</code> (pipeline or stage level) says what happens to the others:`,
     lang:"yaml", code:`lockBehavior: sequential     # every run gets the lock in turn
# lockBehavior: runLatest    # only the latest run gets it; older waiting runs don't
stages:
- stage: DeployProd
  lockBehavior: runLatest    # can also be set per stage
  jobs:
  - deployment: Web
    environment: production
    strategy:
      runOnce:
        deploy:
          steps:
          - script: ./deploy.sh`,
     after:`<p>If <code>lockBehavior</code> isn't specified and the resource has a lock, the default is <b><code>runLatest</code></b>. Checks run in this order: <b>static checks</b> (branch control, required template, evaluate artifact) → <b>pre-check approvals</b> → <b>dynamic checks</b> (approval, Azure Function, REST API, business hours, Azure Monitor alerts) → <b>post-check approvals</b> → <b>exclusive lock</b>.</p>`}
  ],
  tip:`"Only the newest deployment matters" → <b>runLatest</b> (Azure) / <b>cancel-in-progress</b> or the default single pending run (GitHub). "Every deployment must happen, one at a time, in order" → <b>sequential</b> (Azure) / <b><code>queue: max</code></b> without cancel (GitHub). Group per branch/PR: <code>\${{ github.workflow }}-\${{ github.ref }}</code>.`,
  exercises:[
    {id:"cc1", type:"text", lang:"yaml", title:"Cancel superseded PR runs",
     q:`Add a <b>workflow-level</b> concurrency group to this PR workflow so a new push to the same PR/branch cancels the run that's still in progress, while runs for different branches don't affect each other.`,
     starter:`name: PR build
on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm test
`,
     checks:[
       {l:"Top-level concurrency.group", t:a => a.h("concurrency.group",/\S/)},
       {l:"Group includes the workflow name", t:a => a.h("concurrency.group",/github\.workflow/)},
       {l:"Group includes the ref (github.ref or github.head_ref)", t:a => a.h("concurrency.group",/github\.(ref|head_ref)\b/)},
       {l:"cancel-in-progress: true", t:a => a.h("concurrency.cancel-in-progress","true")}
     ],
     hint:`A static group name like <code>ci</code> would make all PRs cancel each other. Build the name from expressions.`,
     solution:`name: PR build
on:
  pull_request:
    branches: [ main ]

concurrency:
  group: \${{ github.workflow }}-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm test`,
     why:`The group is unique per workflow and branch/PR ref, so only runs for the same PR compete. <code>cancel-in-progress: true</code> stops the outdated run immediately, freeing a runner and minutes. <code>github.head_ref</code> works too for pull_request events.`},
    {id:"cc2", type:"mc", title:"Three quick pushes",
     q:`A workflow has <code>concurrency: deploy-staging</code> (no <code>cancel-in-progress</code>, no <code>queue</code>). Run A is running. Run B is queued. Then run C is triggered. What happens?`,
     options:[
       "A is canceled; B and C run in parallel",
       "B is canceled and C waits as the pending run; A keeps running",
       "B and C both wait and run in order after A",
       "C is rejected because the group is busy"
     ], answer:1,
     hint:`By default a group has one running and at most one pending run.`,
     why:`Without <code>cancel-in-progress</code>, A finishes. A group holds at most one pending run by default, so the newer run C replaces B (B is canceled). To keep every run waiting in order, use <code>queue: max</code>.`},
    {id:"cc3", type:"mc", title:"Every release, in order",
     q:`An Azure Pipelines YAML pipeline deploys to the <code>production</code> environment, which has an <b>Exclusive lock</b> check. Compliance requires that <b>every</b> run is deployed, one at a time, in the order the runs were queued. What do you set?`,
     options:[
       "lockBehavior: runLatest",
       "lockBehavior: sequential",
       "Nothing: the default already does this",
       "strategy: maxParallel: 1 on the deployment job"
     ], answer:1,
     hint:`The default lets newer runs overtake older queued ones.`,
     why:`<code>sequential</code> gives the lock to all runs in turn. The default, <code>runLatest</code>, lets only the latest run take the lock, so older queued runs never deploy. <code>maxParallel</code> limits matrix jobs inside one run, not runs of the pipeline.`},
    {id:"cc4", type:"fill", title:"Configure the exclusive lock", mono:true,
     q:`Complete the setup so only the <b>newest</b> run deploys to <code>staging</code>.`,
     tpl:`# 1. Environment "staging" → Approvals and checks → add the [[0]] check
# 2. In the pipeline:
[[1]]: runLatest   # (also the default when not specified)
stages:
- stage: DeployStaging
  jobs:
  - deployment: Web
    [[2]]: staging
    strategy:
      runOnce:
        deploy:
          steps:
          - script: ./deploy.sh`,
     blanks:[["Exclusive lock","exclusive lock"],["lockBehavior"],["environment"]],
     hint:`The check's name says that only one run can hold the resource. The YAML key describes how runs behave around the lock.`,
     why:`The <b>Exclusive lock</b> check on the environment enforces one-at-a-time access; <code>lockBehavior</code> at pipeline (or stage) level selects <code>runLatest</code> or <code>sequential</code>; the <code>environment</code> key on the deployment job is what makes the stage use the locked resource.`},
    {id:"cc5", type:"order", title:"Order of checks",
     q:`Put the categories of approvals and checks in the order Azure Pipelines evaluates them before a stage starts.`,
     items:[
       "Static checks (branch control, required template, evaluate artifact)",
       "Pre-check approvals",
       "Dynamic checks (approval, Azure Function, REST API, business hours, Azure Monitor alerts)",
       "Post-check approvals",
       "Exclusive lock"
     ],
     hint:`The lock is taken last, so a run doesn't hold it while waiting for people.`,
     why:`Static checks → pre-check approvals → dynamic checks → post-check approvals → exclusive lock. Taking the lock last means a run waiting for an approval doesn't block other runs from using the environment.`}
  ]
},

{
  group:"Retain",
  title:"Run retention in Azure DevOps",
  tag:"retention policies · retention leases · releases · tests",
  intro:`Keeping every run forever costs storage and clutters history; deleting too early loses evidence you need for audits or rollbacks. Azure DevOps lets you set project-wide retention and then <b>keep specific runs longer</b> with retention leases.`,
  sections:[
    {h:"Where the settings are", after:`<div class="tablewrap"><table class="ref">
<tr><th>Location</th><th>Controls</th></tr>
<tr><td><b>Project settings → Pipelines → Settings</b></td><td>Days to keep <b>artifacts, symbols and attachments</b> · days to keep <b>runs</b> · days to keep <b>pull request runs</b> · <b>number of recent runs</b> to retain per pipeline. Applies to YAML and classic build pipelines.</td></tr>
<tr><td><b>Project settings → Pipelines → Release retention</b></td><td>Classic releases: days to retain a release, minimum releases to keep (per stage), when deleted releases are permanently destroyed</td></tr>
<tr><td><b>Project settings → Test → Retention</b></td><td>How long automated test runs and results are kept (manual test results aren't deleted)</td></tr>
</table></div>
<p>Per-pipeline retention rules are <b>no longer supported</b> in Azure DevOps Services: retention is configured at <b>project</b> level. The recent-runs count is kept for the pipeline's <b>default branch</b> and each <b>protected branch</b> (Azure Repos), and only <b>succeeded and partially succeeded</b> runs count. Policies are processed once a day.</p>`},
    {h:"When is a run deleted?", lang:"text", code:`A run is deleted only if ALL are true:
  ✔ it is older than the days-to-keep setting
  ✔ it is not one of the recent runs to keep
  ✔ it is not marked to be retained (no retention lease)
  ✔ it is not retained by a (classic) release

Deleted with the run: logs · pipeline and build artifacts · symbols · binaries
                      test results · run metadata · tags/labels created by the Sources task
NOT governed by run retention: packages in Azure Artifacts feeds (NuGet, npm, Universal…)`},
    {h:"Retention leases: keep this run longer", p:`Select <b>Retain</b> from a run's <b>More actions</b> menu, or add a lease from the pipeline with the <b>Lease API</b> (<code>_apis/build/retention/leases</code>), for example from the production stage:`,
     lang:"yaml", code:`- task: PowerShell@2
  condition: and(succeeded(), not(canceled()))
  inputs:
    targetType: inline
    script: |
      $headers = @{ Authorization = 'Bearer $(System.AccessToken)' }
      $lease = @{ daysValid = 365; definitionId = $(System.DefinitionId); runId = $(Build.BuildId);
                  ownerId = 'User:$(Build.RequestedForId)'; protectPipeline = $false }
      $uri = "$(System.CollectionUri)$(System.TeamProject)/_apis/build/retention/leases?api-version=6.0-preview.1"
      Invoke-RestMethod -Uri $uri -Method POST -Headers $headers -ContentType 'application/json' -Body (ConvertTo-Json @($lease))`,
     after:`<p>YAML pipelines can't set retention <b>per environment</b>; leases are how you keep production runs longer. Classic releases automatically retain the builds they consume. To keep build output beyond any retention limit, copy it to your own storage (e.g. <b>Copy files</b> task); data published as build artifacts is still subject to retention cleanup.</p>`}
  ],
  tip:`"Keep production runs for a year, others 30 days" in YAML → <b>retention lease</b> from the production stage. "Where do I change how long runs are kept?" → <b>Project settings → Pipelines → Settings</b> (not per pipeline). "Test results disappear too early" → <b>test retention</b> settings. Packages are governed by <b>feed</b> retention, not run retention.`,
  exercises:[
    {id:"ra1", type:"multi", title:"Project-level retention settings",
     q:`Which settings can you configure under <b>Project settings → Pipelines → Settings</b> (retention)? <i>Select all that apply.</i>`,
     options:[
       "Days to keep artifacts, symbols and attachments",
       "Days to keep runs",
       "Days to keep pull request runs",
       "Number of recent runs to retain per pipeline",
       "A different retention rule for each individual YAML pipeline",
       "Maximum number of versions per package in a feed"
     ], answer:[0,1,2,3],
     hint:`Retention is project-wide now, and packages live somewhere else.`,
     why:`The project settings page holds the four run retention settings. Per-pipeline retention rules are no longer supported in Azure DevOps Services, and package version limits are a feed setting in Azure Artifacts.`},
    {id:"ra2", type:"multi", title:"Will this run be deleted?",
     q:`Which conditions must <b>all</b> be true before retention deletes a pipeline run? <i>Select all that apply.</i>`,
     options:[
       "It's older than the configured number of days to keep runs",
       "It isn't one of the recent runs the policy keeps",
       "It isn't marked to be retained (no retention lease)",
       "It isn't retained by a release",
       "It failed",
       "It was triggered by a pull request"
     ], answer:[0,1,2,3],
     hint:`Days, recent count, leases, releases.`,
     why:`A run is deleted only if it's past the days setting, not among the recent runs to keep, not retained by a lease, and not retained by a release. Outcome and trigger don't decide deletion (PR runs just have their own days setting, and only succeeded/partially succeeded runs count towards the recent runs).`},
    {id:"ra3", type:"fill", title:"Add a retention lease", mono:true,
     q:`Complete the script that keeps the current run for a year by adding a retention lease.`,
     tpl:`$headers = @{ Authorization = 'Bearer $(System.[[0]])' }
$lease = @{
  daysValid       = 365
  definitionId    = $(System.[[1]])
  runId           = $(Build.[[2]])
  ownerId         = 'User:$(Build.RequestedForId)'
  protectPipeline = $false
}
$uri = "$(System.CollectionUri)$(System.TeamProject)/_apis/build/retention/[[3]]?api-version=6.0-preview.1"
Invoke-RestMethod -Uri $uri -Method POST -Headers $headers -ContentType 'application/json' -Body (ConvertTo-Json @($lease))`,
     blanks:[["AccessToken"],["DefinitionId"],["BuildId"],["leases"]],
     hint:`The pipeline's own OAuth token, the pipeline (definition) ID, the run (build) ID, and the plural name of the API resource.`,
     why:`The Lease API (<code>…/_apis/build/retention/leases</code>) takes the pipeline's <code>definitionId</code>, the <code>runId</code> (<code>Build.BuildId</code>), an owner and <code>daysValid</code>. <code>System.AccessToken</code> authenticates the call as the pipeline's build identity.`},

     q:`A multi-stage YAML pipeline deploys to dev, test and production. Project retention keeps runs for 30 days. Auditors need every run that reached <b>production</b> for one year; other runs can go after 30 days. What do you do?`,
     options:[
       "Set days to keep runs to 365 for the whole project",
       "Configure a retention rule on the production environment",

       "Use PublishBuildArtifacts@1 instead of pipeline artifacts in the production stage"

     hint:`YAML can't vary retention by environment, but a run can be retained individually.`,
     why:`Retention for YAML pipelines is set only in project settings and can't be configured per environment. A retention lease created from the production stage keeps exactly those runs for 365 days. Raising the project setting would keep every run for a year, and the artifact task type doesn't change retention.`},

       ["Automated test results published by the run","Deleted with the run"],

       ["Build output a Copy files step copied to your own file share","Not affected by run retention"]
     ],
